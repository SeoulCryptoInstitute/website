<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <!--
      `/` → `/ko`.

      정적 export에는 next.config의 redirects()가 동작하지 않는다(서버가 없다).
      경로를 상대(./ko)로 두면 프로젝트 페이지(/website/)와 커스텀 도메인(/) 양쪽에서
      모두 올바르게 풀린다.
    -->
    <meta http-equiv="refresh" content="0; url=./ko" />
    <title>Seoul Crypto Institute</title>
    <script>
      location.replace("./ko" + location.search + location.hash);
    </script>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0e2593;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p><a href="./ko">Seoul Crypto Institute</a></p>
  </body>
</html>
